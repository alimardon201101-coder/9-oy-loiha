<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | NextStep</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="NextStep admin paneli — foydalanuvchi murojaatlari bilan ishlash.">
  <link rel="stylesheet" href="./assets/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
</head>

<body data-page="admin" class="font-sans bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="LOGO.png" alt="NextStep" class="w-9 h-9 rounded-xl object-cover shadow-md shadow-brand-500/20">
        <span class="text-xl font-extrabold tracking-tight">NextStep <span
            class="text-brand-500 font-medium text-sm">Admin Panel</span></span>
      </div>
      <div class="flex items-center gap-3">
        <div id="adminEmailDisplay" class="text-xs font-semibold text-slate-400">Tekshirilmoqda...</div>
        <a href="./index.html"
          class="text-xs font-bold text-slate-300 hover:text-white px-3 py-2 rounded-lg bg-white/10 transition-colors">
          <i class="fa-solid fa-house mr-1"></i> Saytga
        </a>
      </div>
    </div>
  </header>

  <!-- Main Admin Layout -->
  <main
    class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-6 md:h-[calc(300px)] lg:h-[calc(400px)] xl:h-[calc(500px)]">

    <!-- Users / Chats List Sidebar -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col">
      <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-brand-600"></i>
          <h3 class="font-bold text-slate-800 text-sm">Foydalanuvchilar</h3>
        </div>
      </div>

      <!-- Dynamic Playlist Items Wrapper -->
      <div id="usersListContainer" class="max-h-[380px] overflow-y-auto custom-scrollbar p-2 flex flex-col gap-1.5">
        <!-- Dynamic JavaScript Content Here -->
      </div>
    </div>

    <!-- Active Chat / Message Thread Box -->
    <div
      class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden md:col-span-2 min-h-[300px]">
      <div id="chatHeader"
        class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-700 flex items-center justify-between">
        <span>Foydalanuvchi tanlang</span>
      </div>

      <div id="adminMessagesBox"
        class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 bg-slate-50/50 flex flex-col justify-center items-center text-slate-400 text-sm custom-scrollbar">
        <i class="fa-regular fa-comment-dots text-4xl mb-2 text-slate-300"></i>
        <p>Chatni boshlash uchun chapdan foydalanuvchini tanlang.</p>
      </div>

  <form id="adminReplyForm" class="p-4 flex bg-white border-t border-slate-200 items-center gap-3">
        <input type="text" id="adminReplyInput" required placeholder="Admin nomidan javob yozing..."
          class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-600 text-sm font-medium">
        <button type="submit"
          class="px-5 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center gap-2 shrink-0">
          <span>Yuborish</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>

  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
