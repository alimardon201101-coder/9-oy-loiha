<body data-page="dictionary" data-lang="russian" class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & Back Button -->
      <div class="flex items-center gap-4">
        <a href="../index.html#kurslar" class="inline-flex items-center gap-2 text-slate-600 hover:text-brand-600 font-medium text-sm bg-slate-100 hover:bg-brand-50 px-3 py-2 rounded-xl transition-all duration-200 group">

          <span class="font-bold text-xl tracking-tight text-slate-900 hidden sm:inline">Next<span class="text-brand-600">Step</span></span>

      <!-- Course Info Header Badge -->
      <div class="hidden md:flex items-center gap-2 bg-sky-50 border border-sky-100 text-sky-700 px-4 py-1.5 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span>
        Rus Tili Videodarslari
      </div>

      <!-- Right Controls: Profile -->
      <a href="../profil.html" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all duration-200 shadow-md shadow-brand-500/20 hover:shadow-lg">
        <i class="fa-regular fa-user"></i>
        <span>Profil</span>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm mb-8 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between md:space-x-4">
      <div class="relative flex-grow">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="So'z axtaring (O'zbekcha yoki Ruscha)..." class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 transition">
        <button id="voiceBtn" title="Ovozli qidiruv" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 transition">
          <i class="fas fa-microphone"></i>
        </button>
      </div>

      <div class="flex items-center space-x-3">
        <span class="text-sm font-semibold text-slate-500 whitespace-nowrap"><i class="fas fa-sort mr-1"></i> Tartib:</span>
        <select id="sortSelect" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-none focus:border-blue-500">
          <option value="az">A - Z (O'zbekcha)</option>
          <option value="za">Z - A (O'zbekcha)</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4 px-2">
      <p id="wordCount" class="text-sm text-slate-500 font-medium">Jami so'zlar: 0</p>
    </div>

    <div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>
