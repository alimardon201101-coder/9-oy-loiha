<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rus tili Lug'ati - NextStep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          }
        }
      }
    }
  </script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & Back Button -->
      <div class="flex items-center gap-4">
        <a href="../index.html#kurslar" class="inline-flex items-center gap-2 text-slate-600 hover:text-brand-600 font-medium text-sm bg-slate-100 hover:bg-brand-50 px-3 py-2 rounded-xl transition-all duration-200 group">
          <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
          <span>Bosh sahifaga</span>
        </a>
          <a href="./rus.html" class="inline-flex items-center gap-2 text-slate-600 hover:text-brand-600 font-medium text-sm bg-slate-100 hover:bg-brand-50 px-3 py-2 rounded-xl transition-all duration-200 group">
          <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i>
          <span>Rus tili sahifaga</span>
        </a>
        <div class="h-5 w-px bg-slate-200 hidden sm:block"></div>
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-brand-600 text-white rounded-xl flex items-center justify-center font-extrabold text-lg shadow-md shadow-brand-500/20">N</div>
          <span class="font-bold text-xl tracking-tight text-slate-900 hidden sm:inline">Next<span class="text-brand-600">Step</span></span>
        </div>
      </div>

      <!-- Course Info Header Badge -->
      <div class="hidden md:flex items-center gap-2 bg-sky-50 border border-sky-100 text-sky-700 px-4 py-1.5 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span>
        Rus Tili Videodarslari
      </div>

      <!-- Right Controls: Profile -->
      <a href="../profil.html" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all duration-200 shadow-md shadow-brand-500/20 hover:shadow-lg">
        <i class="fa-regular fa-user"></i>
        <span>Profil</span>
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm mb-8 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between md:space-x-4">
      <div class="relative flex-grow">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="So'z axtaring (O'zbekcha yoki Ruscha)..." class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 transition">
        <button id="voiceBtn" title="Ovozli qidiruv" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 transition">
          <i class="fas fa-microphone"></i>
        </button>
      </div>

      <div class="flex items-center space-x-3">
        <span class="text-sm font-semibold text-slate-500 whitespace-nowrap"><i class="fas fa-sort mr-1"></i> Tartib:</span>
        <select id="sortSelect" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-none focus:border-blue-500">
          <option value="az">A - Z (O'zbekcha)</option>
          <option value="za">Z - A (O'zbekcha)</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4 px-2">
      <p id="wordCount" class="text-sm text-slate-500 font-medium">Jami so'zlar: 0</p>
    </div>

    <div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <script>
    const TARGET_LANG = 'rus';
    const SPEECH_LANG = 'ru-RU';

    let dictionaryData = [];
    const wordListContainer = document.getElementById('wordList');
    const searchInput = document.getElementById('searchInput');
    const voiceBtn = document.getElementById('voiceBtn');
    const sortSelect = document.getElementById('sortSelect');
    const wordCount = document.getElementById('wordCount');

    async function loadDictionary() {
      try {
        const response = await fetch('dictionary.json');
        dictionaryData = await response.json();
        renderWords();
      } catch (error) {
        wordListContainer.innerHTML = `<div class="col-span-full text-center py-8 text-rose-500"><i class="fas fa-exclamation-circle text-2xl mb-2"></i><p>dictionary.json faylini yuklashda xatolik yuz berdi!</p></div>`;
      }
    }

    function renderWords() {
      const query = searchInput.value.toLowerCase().trim();
      const sortOrder = sortSelect.value;

      let filtered = dictionaryData.filter(item => {
        const uzbVal = (item.uzb || '').toLowerCase();
        const targetVal = (item[TARGET_LANG] || '').toLowerCase();
        return uzbVal.includes(query) || targetVal.includes(query);
      });

      filtered.sort((a, b) => {
        const wordA = (a.uzb || '').toLowerCase();
        const wordB = (b.uzb || '').toLowerCase();
        return sortOrder === 'az' ? wordA.localeCompare(wordB) : wordB.localeCompare(wordA);
      });

      wordCount.textContent = `Natijalar: ${filtered.length} ta so'z`;
      wordListContainer.innerHTML = '';

      if (filtered.length === 0) {
        wordListContainer.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fas fa-search-minus text-3xl mb-2"></i><p>Hech narsa topilmadi</p></div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-xl border border-blue-100 shadow-sm hover:shadow-md transition flex items-center justify-between group';

        const targetText = item[TARGET_LANG] || '-';
        const uzbText = item.uzb || '-';

        card.innerHTML = `
          <div>
            <div class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-1">O'zbekcha</div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">${uzbText}</h3>
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Ruscha</div>
            <p class="text-base font-semibold text-blue-900">${targetText}</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="speakText('${targetText.replace(/'/g, "\\'")}')" title="Ovoz chiqarish" class="w-10 h-10 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white rounded-lg flex items-center justify-center transition">
              <i class="fas fa-volume-high"></i>
            </button>
          </div>
        `;
        fragment.appendChild(card);
      });

      wordListContainer.appendChild(fragment);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = SPEECH_LANG;
        window.speechSynthesis.speak(utterance);
      }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'uz-UZ';

      voiceBtn.addEventListener('click', () => {
        recognition.start();
        voiceBtn.classList.add('text-rose-500', 'animate-pulse');
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        searchInput.value = transcript;
        renderWords();
        voiceBtn.classList.remove('text-rose-500', 'animate-pulse');
      };

      recognition.onerror = () => voiceBtn.classList.remove('text-rose-500', 'animate-pulse');
      recognition.onend = () => voiceBtn.classList.remove('text-rose-500', 'animate-pulse');
    } else {
      voiceBtn.style.display = 'none';
    }

    searchInput.addEventListener('input', renderWords);
    sortSelect.addEventListener('change', renderWords);

    loadDictionary();
  </script>
</body>
</html>
