<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemis tili Lug'ati - NextStep</title>
  <meta name="description" content="Nemischa–o'zbekcha interaktiv lug'at: qidiruv, ovozli talaffuz va alifbo tartibida saralash.">
  <link rel="canonical" href="https://nextstep-uz.netlify.app/kurslar/nem-dictionary.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body data-page="dictionary" data-lang="german" class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">
  <header class="bg-white border-b border-blue-100 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="nem.html" class="flex items-center space-x-2 text-blue-600 font-semibold hover:text-blue-800 transition">
        <i class="fas fa-arrow-left"></i>
        <span>Nemis tili bo'limiga qaytish</span>
      </a>
      <div class="flex items-center space-x-3 bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100">
        <span class="text-2xl">🇩🇪</span>
        <h1 class="text-lg font-bold text-blue-900">Nemis tili lug'ati</h1>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm mb-8 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between md:space-x-4">
      <div class="relative flex-grow">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="So'z axtaring (O'zbekcha yoki Nemischa)..." class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 transition">
        <button id="voiceBtn" title="Ovozli qidiruv" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-blue-600 transition">
          <i class="fas fa-microphone"></i>
        </button>
      </div>

      <div class="flex items-center space-x-3">
        <span class="text-sm font-semibold text-slate-500 whitespace-nowrap"><i class="fas fa-sort mr-1"></i> Tartib:</span>
        <select id="sortSelect" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-medium focus:outline-none focus:border-blue-500">
          <option value="az">A - Z (O'zbekcha)</option>
          <option value="za">Z - A (O'zbekcha)</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4 px-2">
      <p id="wordCount" class="text-sm text-slate-500 font-medium">Jami so'zlar: 0</p>
    </div>

    <div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>
<script type="module" src="../app.js"></script>
</body>
</html>
